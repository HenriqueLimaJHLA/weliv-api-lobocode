services:
  # Backend NestJS
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: weliv-backend
    env_file:
      - .env
    ports:
      - '30100:3000'  # weliv: bloco 30xxx
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_USE_SSL=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.2'
    restart: unless-stopped
    networks:
      - app-net-weliv

  # Database PostgreSQL
  db:
    image: postgres:16.8-alpine3.20
    container_name: weliv-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
    ports:
      - '15432:5432'  # weliv: bloco 15xxx
    volumes:
      - weliv-api-lobocode_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.2'
    restart: unless-stopped
    networks:
      - app-net-weliv

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: weliv-redis
    ports:
      - '16379:6379'  # weliv: bloco 16xxx
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
        reservations:
          memory: 128M
          cpus: '0.1'
    restart: unless-stopped
    networks:
      - app-net-weliv

  # MinIO - Armazenamento de Arquivos
  minio:
    image: minio/minio:latest
    container_name: weliv-minio
    env_file:
      - .env
    ports:
      - '19000:9000'  # weliv: bloco 19xxx
      - '19001:9001'  # weliv: bloco 19xxx
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.1'
    restart: unless-stopped
    networks:
      - app-net-weliv

volumes:
  weliv-api-lobocode_postgres_data:
    external: true
  redis_data:
  minio_data:

networks:
  app-net-weliv:
    external: true
